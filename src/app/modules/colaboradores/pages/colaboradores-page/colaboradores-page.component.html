<section class="flex min-h-full flex-col gap-4">
  <header class="min-h-9">
    <h1 class="text-xl font-bold text-slate-950 dark:text-white">Colaboradores</h1>
  </header>

  <div>
    <app-colaboradores-metrics [metrics]="metrics" />
  </div>

  <div>
    <app-colaboradores-filters [colaboradores]="colaboradores" [exportDisabled]="!filteredColaboradores.length" (filtersChange)="updateFilters($event)" (newColaborador)="openNewColaboradorModal()" (exportExcel)="exportExcel()" (exportPdf)="exportPdf()" />
  </div>

  @if (selectedColaboradorIds.length) {
    <div class="flex flex-wrap items-center gap-2 rounded-lg border border-blue-200 bg-blue-50 px-3 py-2 text-xs dark:border-blue-500/30 dark:bg-blue-500/10">
      <span class="mr-1 font-semibold text-blue-800 dark:text-blue-200">{{ selectedColaboradorIds.length }} seleccionado(s)</span>
      <button type="button" class="rounded-md bg-emerald-600 px-3 py-1.5 font-semibold text-white transition hover:bg-emerald-700" (click)="updateSelectedStatus('Activo')">Activar</button>
      <button type="button" class="rounded-md bg-slate-600 px-3 py-1.5 font-semibold text-white transition hover:bg-slate-700" (click)="updateSelectedStatus('Inactivo')">Inactivar</button>
      <button type="button" class="rounded-md border border-rose-200 bg-white px-3 py-1.5 font-semibold text-rose-600 transition hover:bg-rose-50 dark:border-rose-500/30 dark:bg-transparent dark:text-rose-400" (click)="deleteSelectedColaboradores()">Eliminar</button>
    </div>
  }

  <div>
    <app-colaboradores-table [colaboradores]="filteredColaboradores" [(expandedId)]="expandedId" (editColaborador)="editColaborador($event)" (selectedIdsChange)="updateSelectedColaboradores($event)" />
  </div>
</section>

<app-nuevo-colaborador-modal
  [isOpen]="isNewColaboradorModalOpen"
  [colaborador]="selectedColaborador"
  (closeModal)="closeNewColaboradorModal()"
  (saveColaborador)="saveColaborador($event)"
  (deleteColaborador)="deleteColaborador($event)"
/>

<app-confirm-dialog
  [isOpen]="pendingDeletionIds.length > 0"
  [title]="'Eliminar colaborador' + (pendingDeletionIds.length > 1 ? 'es' : '')"
  [message]="'¿Confirmas la eliminación de ' + pendingDeletionIds.length + ' colaborador' + (pendingDeletionIds.length > 1 ? 'es' : '') + '? Esta acción no se puede deshacer.'"
  confirmLabel="Eliminar"
  (cancel)="cancelDeletion()"
  (confirm)="confirmDeletion()"
/>
