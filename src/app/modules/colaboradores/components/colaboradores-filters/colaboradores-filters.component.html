<section class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <div class="grid gap-3 lg:grid-cols-[1.4fr_auto_auto_auto] lg:items-end">
    <label class="space-y-1.5">
      <span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Colaborador</span>
      <span class="relative block">
        <svg class="pointer-events-none absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m21 21-4.3-4.3"/><circle cx="11" cy="11" r="8"/></svg>
        <input class="h-9 w-full rounded-md border border-slate-200 bg-white pl-9 pr-3 text-xs text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 dark:focus:ring-blue-500/20" placeholder="Buscar colaborador..." type="search" [value]="filters.search" (input)="updateFilter('search', $any($event.target).value)" />
      </span>
    </label>
    <button class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-slate-200 bg-white text-slate-600 transition hover:bg-slate-50 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 dark:hover:bg-slate-800 dark:hover:text-white" type="button" aria-label="Mostrar filtros" title="Mostrar filtros" [attr.aria-expanded]="isFiltersOpen" (click)="toggleFilters()">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18l-7 8v5l-4 2v-7L3 5Z"/></svg>
    </button>
    @if (hasActiveFilters) {
      <button class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-slate-200 bg-white text-slate-600 transition hover:bg-rose-50 hover:text-rose-600 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 dark:hover:bg-rose-500/10 dark:hover:text-rose-400" type="button" aria-label="Limpiar filtros" title="Limpiar filtros" (click)="clearFilters()">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    } @else {
      <span class="hidden h-9 w-9 lg:block" aria-hidden="true"></span>
    }
    <button class="inline-flex h-9 items-center justify-center gap-2 rounded-md bg-[#22C55E] px-3 text-xs font-semibold text-white shadow-sm transition hover:bg-[#22C55E]" type="button" (click)="newColaborador.emit()">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      Nuevo colaborador
    </button>
  </div>

  @if (isFiltersOpen) {
    <div class="mt-3 grid gap-2.5 border-t border-slate-100 pt-3 dark:border-slate-800 sm:grid-cols-2 lg:grid-cols-5">
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Cargo</span><app-select-searchable [value]="filters.cargo" [options]="cargoOptions" placeholder="Todos" searchPlaceholder="Buscar cargo..." buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('cargo', $any($event))" /></label>
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Área</span><app-select-searchable [value]="filters.area" [options]="areaOptions" placeholder="Todas" searchPlaceholder="Buscar área..." buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('area', $any($event))" /></label>
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Documento</span><app-select-searchable [value]="filters.documento" [options]="documentoOptions" placeholder="Todos" searchPlaceholder="Buscar documento..." buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('documento', $any($event))" /></label>
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Estado civil</span><app-select-searchable [value]="filters.estadoCivil" [options]="estadoCivilOptions" placeholder="Todos" buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('estadoCivil', $any($event))" /></label>
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Estado</span><app-select-searchable [value]="filters.estado" [options]="estadoOptions" placeholder="Todos" buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('estado', $any($event))" /></label>
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Sexo</span><app-select-searchable [value]="filters.sexo" [options]="sexoOptions" placeholder="Todos" buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('sexo', $any($event))" /></label>
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Jornada</span><app-select-searchable [value]="filters.jornada" [options]="jornadaOptions" placeholder="Todas" buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('jornada', $any($event))" /></label>
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Grado de instrucción</span><app-select-searchable [value]="filters.gradoInstruccion" [options]="gradoInstruccionOptions" placeholder="Todos" searchPlaceholder="Buscar grado..." buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('gradoInstruccion', $any($event))" /></label>
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Tipo de sangre</span><app-select-searchable [value]="filters.tipoSangre" [options]="tipoSangreOptions" placeholder="Todos" buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('tipoSangre', $any($event))" /></label>
      <div class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Tallas</span><div class="grid grid-cols-3 gap-2"><app-select-searchable [value]="filters.camisa" [options]="camisaOptions" placeholder="Camisa" buttonClass="h-9 min-w-0 rounded-md border border-slate-200 bg-white px-2 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('camisa', $any($event))" /><app-select-searchable [value]="filters.pantalon" [options]="pantalonOptions" placeholder="Pantalón" buttonClass="h-9 min-w-0 rounded-md border border-slate-200 bg-white px-2 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('pantalon', $any($event))" /><app-select-searchable [value]="filters.calzado" [options]="calzadoOptions" placeholder="Calzado" buttonClass="h-9 min-w-0 rounded-md border border-slate-200 bg-white px-2 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateFilter('calzado', $any($event))" /></div></div>
    </div>
  }
</section>
