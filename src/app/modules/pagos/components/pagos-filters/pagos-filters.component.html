<section class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
  <div class="grid gap-3 lg:grid-cols-[1.3fr_1fr_1fr_auto_auto] lg:items-end">
    <label class="space-y-1.5">
      <span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Colaborador</span>
      <span class="relative block">
        <svg class="pointer-events-none absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m21 21-4.3-4.3"/><circle cx="11" cy="11" r="8"/></svg>
        <input class="h-9 w-full rounded-md border border-slate-200 bg-white pl-9 pr-3 text-xs text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 dark:focus:ring-blue-500/20" placeholder="Buscar por nombre, cargo, área o banco..." type="search" [value]="filters.search" (input)="updateText('search', $any($event.target).value)" />
      </span>
    </label>
    <div class="space-y-1.5">
      <span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Pago desde</span>
      <app-date-picker [value]="filters.dateFrom" [maxDate]="filters.dateTo" placeholder="dd/mm/aaaa" inputClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 cursor-pointer" (valueChange)="updateDate('dateFrom', $event)" />
    </div>
    <div class="space-y-1.5">
      <span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Pago hasta</span>
      <div class="relative">
        <app-date-picker [value]="filters.dateTo" [minDate]="filters.dateFrom" placeholder="dd/mm/aaaa" inputClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 !pr-16 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 cursor-pointer" (valueChange)="updateDate('dateTo', $event)" />
        @if (hasDateFilters) { <button class="absolute right-8 top-1/2 z-10 inline-flex h-6 w-6 -translate-y-1/2 items-center justify-center rounded text-slate-400 transition hover:bg-rose-50 hover:text-rose-600 dark:text-slate-500 dark:hover:bg-rose-500/10 dark:hover:text-rose-400" type="button" aria-label="Limpiar rango de fechas" title="Limpiar rango de fechas" (click)="clearDates()"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button> }
      </div>
    </div>
    <button [class]="filterButtonClasses" type="button" aria-label="Mostrar filtros" title="Mostrar filtros" [attr.aria-expanded]="isFiltersOpen" (click)="toggleFilters()">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18l-7 8v5l-4 2v-7L3 5Z"/></svg>
      @if (hasAdvancedFilters) { <span class="absolute -right-1 -top-1 h-2.5 w-2.5 rounded-full border-2 border-white bg-blue-500 dark:border-slate-900"></span> }
    </button>
    <app-table-export-buttons [disabled]="exportDisabled" (exportExcel)="exportExcel.emit()" (exportPdf)="exportPdf.emit()" />
  </div>

  @if (isFiltersOpen) {
    <div animate.enter="ayni-disclosure-enter" animate.leave="ayni-disclosure-leave" class="mt-4 grid gap-4 border-t border-slate-200 pt-4 dark:border-slate-800 lg:grid-cols-[1fr_1fr_2fr_auto] lg:items-end">
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Área</span><app-select-searchable [value]="filters.area" [options]="areaOptions" placeholder="Todas las áreas" searchPlaceholder="Buscar área..." buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateText('area', $any($event))" /></label>
      <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Estado de pago</span><app-select-searchable [value]="filters.estado" [options]="estadoOptions" placeholder="Todos los estados" buttonClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs text-slate-700 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" (valueChange)="updateText('estado', $any($event))" /></label>
      <div class="space-y-1.5">
        <div class="flex items-center justify-between gap-3"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Monto mensual</span><span class="text-[11px] font-semibold tabular-nums text-blue-600 dark:text-blue-300">{{ formatMoney(filters.minAmount) }} — {{ formatMoney(filters.maxAmount) }}</span></div>
        <div class="payment-range relative h-9" aria-label="Rango de monto mensual">
          <div class="absolute left-0 right-0 top-1/2 h-1 -translate-y-1/2 rounded-full bg-slate-200 dark:bg-slate-700"></div>
          <div class="payment-range-active absolute top-1/2 h-1 -translate-y-1/2 overflow-hidden rounded-full bg-blue-500 transition-all duration-200" [style]="selectedRangeStyle"></div>
          <input class="payment-range-input" type="range" [min]="minLimit" [max]="maxLimit" step="100" [value]="filters.minAmount" (input)="updateAmount('minAmount', $any($event.target).value)" aria-label="Monto mínimo" />
          <input class="payment-range-input" type="range" [min]="minLimit" [max]="maxLimit" step="100" [value]="filters.maxAmount" (input)="updateAmount('maxAmount', $any($event.target).value)" aria-label="Monto máximo" />
        </div>
      </div>
      <button class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-slate-200 bg-white text-slate-600 transition hover:bg-rose-50 hover:text-rose-600 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-300 dark:hover:bg-rose-500/10 dark:hover:text-rose-400" type="button" aria-label="Limpiar filtros de pagos" title="Limpiar filtros" [disabled]="!hasAdvancedFilters" (click)="clearAdvancedFilters()"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
  }
</section>
