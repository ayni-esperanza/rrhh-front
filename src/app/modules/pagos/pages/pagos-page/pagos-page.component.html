<section class="flex min-h-full flex-col gap-4">
  <header class="min-h-9">
    <h1 class="text-xl font-bold text-slate-950 dark:text-white">Pagos</h1>
  </header>

  <app-pagos-metrics [metrics]="metrics" />
  <app-pagos-filters [pagos]="pagos" (filtersChange)="updateFilters($event)" />
  <app-pagos-table [pagos]="filteredPagos" [periodLabel]="periodLabel" />
</section>
