@if (isOpen) {
  <div animate.enter="ayni-modal-enter" animate.leave="ayni-modal-leave" class="fixed inset-0 z-[75] flex items-center justify-center bg-slate-950/55 p-4 backdrop-blur-[2px]" role="dialog" aria-modal="true" aria-labelledby="credentials-modal-title" (click)="closeModal.emit()">
    <section class="w-full max-w-md rounded-xl bg-white p-5 shadow-2xl dark:bg-slate-900" (click)="$event.stopPropagation()">
      <header class="flex items-start gap-3"><span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-300"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></span><div><h2 id="credentials-modal-title" class="text-base font-bold text-slate-950 dark:text-white">Usuario creado correctamente</h2><p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Comparte estas credenciales con el nuevo usuario.</p></div></header>

      <div class="mt-5 space-y-3 rounded-lg border border-slate-200 bg-slate-50 p-4 dark:border-slate-800 dark:bg-slate-950/70">
        <div><span class="text-[10px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Usuario</span><p class="mt-1 break-all text-sm font-semibold text-slate-900 dark:text-white">{{ correo }}</p></div>
        <div class="border-t border-slate-200 pt-3 dark:border-slate-800"><span class="text-[10px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Contraseña asignada</span><p class="mt-1 break-all font-mono text-sm font-bold text-blue-700 dark:text-blue-300">{{ password }}</p></div>
      </div>

      <p class="mt-3 text-[10px] leading-relaxed text-amber-700 dark:text-amber-300">La contraseña se muestra una sola vez. Indica al usuario que debe cambiarla después de iniciar sesión.</p>

      <footer class="mt-5 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><button class="h-9 rounded-lg border border-slate-200 px-4 text-xs font-bold text-slate-700 transition hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800" type="button" (click)="closeModal.emit()">Cerrar</button><a class="inline-flex h-9 items-center justify-center gap-2 rounded-lg bg-[#25D366] px-4 text-xs font-bold text-white transition hover:bg-[#1fba59]" [href]="whatsappUrl" target="_blank" rel="noopener noreferrer"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a9.8 9.8 0 0 0-8.5 14.7L2 22l5.5-1.4A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3.2.8.9-3.1-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-2-1.2 7.2 7.2 0 0 1-1.4-1.8c-.1-.2 0-.4.1-.5l.4-.5.2-.4c.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.1s.9 2.5 1 2.6c.1.2 1.8 2.8 4.5 3.9.6.3 1.1.4 1.5.5.6.2 1.2.2 1.7.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.2-.1-.4-.2-.7-.3Z"/></svg>Compartir por WhatsApp</a></footer>
    </section>
  </div>
}
