@if (isOpen) {
  <div animate.enter="ayni-modal-enter" animate.leave="ayni-modal-leave" class="fixed inset-0 z-[70] flex items-center justify-center bg-slate-950/55 p-4 backdrop-blur-[2px]" role="dialog" aria-modal="true" aria-labelledby="usuario-modal-title" (click)="close()">
    <section class="w-full max-w-lg rounded-xl bg-white p-5 shadow-2xl dark:bg-slate-900" (click)="$event.stopPropagation()">
      <header class="flex items-start justify-between gap-3">
        <div><h2 id="usuario-modal-title" class="text-base font-bold text-slate-950 dark:text-white">{{ isEditing ? 'Editar usuario' : 'Nuevo usuario' }}</h2><p class="mt-1 text-xs text-slate-500 dark:text-slate-400">{{ isEditing ? 'Actualiza los datos y permisos del usuario.' : 'Registra un usuario para darle acceso al sistema.' }}</p></div>
        <button class="inline-flex h-8 w-8 items-center justify-center rounded-md text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white" type="button" aria-label="Cerrar modal" title="Cerrar" (click)="close()"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </header>

      <form class="mt-5 grid gap-4 sm:grid-cols-2" (ngSubmit)="save()">
        <label class="space-y-1.5 sm:col-span-2"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Nombre completo</span><input class="h-10 w-full rounded-lg border bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:bg-slate-950 dark:text-slate-200 dark:focus:ring-blue-500/20" [class.border-rose-500]="invalidName" [class.border-slate-200]="!invalidName" [class.dark:border-slate-800]="!invalidName" name="nombre" [(ngModel)]="draft.nombre" autocomplete="name" placeholder="Ej. Ana Torres" />@if (invalidName) { <span class="block text-[10px] font-medium text-rose-600">Ingresa al menos 3 caracteres.</span> }</label>
        <label class="space-y-1.5 sm:col-span-2"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Correo electrónico</span><input class="h-10 w-full rounded-lg border bg-white px-3 text-xs text-slate-700 outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:bg-slate-950 dark:text-slate-200 dark:focus:ring-blue-500/20" [class.border-rose-500]="invalidEmail || emailExists" [class.border-slate-200]="!invalidEmail && !emailExists" [class.dark:border-slate-800]="!invalidEmail && !emailExists" name="correo" [(ngModel)]="draft.correo" type="email" autocomplete="email" placeholder="usuario@empresa.com" />@if (invalidEmail) { <span class="block text-[10px] font-medium text-rose-600">Ingresa un correo válido.</span> } @else if (emailExists) { <span class="block text-[10px] font-medium text-rose-600">Este correo ya está registrado.</span> }</label>
        <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Rol</span><app-select-searchable [(ngModel)]="draft.rol" name="rol" [options]="rolOptions" [allowEmpty]="false" searchPlaceholder="Buscar rol..." buttonClass="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-xs text-slate-700 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" /></label>
        <label class="space-y-1.5"><span class="text-[11px] font-bold text-slate-700 dark:text-slate-300">Estado</span><app-select-searchable [(ngModel)]="draft.estado" name="estado" [options]="estadoOptions" [allowEmpty]="false" buttonClass="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-xs text-slate-700 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" /></label>

        <footer class="mt-2 flex flex-col-reverse gap-2 sm:col-span-2 sm:flex-row sm:items-center sm:justify-between"><span class="flex gap-2">@if (isEditing) { <button class="h-9 rounded-lg border border-rose-200 px-4 text-xs font-bold text-rose-600 transition hover:bg-rose-50 dark:border-rose-500/30 dark:text-rose-400 dark:hover:bg-rose-500/10" type="button" (click)="requestDelete()">Eliminar usuario</button><button class="h-9 rounded-lg border border-amber-200 px-4 text-xs font-bold text-amber-700 transition hover:bg-amber-50 dark:border-amber-500/30 dark:text-amber-300" type="button" (click)="resetPassword.emit(draft)">Restablecer clave</button> }</span><span class="flex justify-end gap-2"><button class="h-9 rounded-lg border border-slate-200 px-4 text-xs font-bold text-slate-700 transition hover:bg-slate-50 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800" type="button" (click)="close()">Cancelar</button><button class="h-9 rounded-lg bg-[#22C55E] px-5 text-xs font-bold text-white transition hover:bg-green-600" type="submit">{{ isEditing ? 'Guardar cambios' : 'Crear usuario' }}</button></span></footer>
      </form>
    </section>
  </div>
}
