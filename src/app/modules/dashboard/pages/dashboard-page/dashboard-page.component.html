<section class="flex min-h-full flex-col gap-4">
  <header class="flex min-h-9 flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <h1 class="text-xl font-bold text-slate-950 dark:text-white">Reportes / Dashboard</h1>
    <label class="block w-40">
      <span class="sr-only">Periodo del dashboard</span>
      <app-date-picker
        [value]="selectedPeriod()"
        (valueChange)="changePeriod($event)"
        [monthOnly]="true"
        [maxDate]="maxPeriod"
        placeholder="Seleccionar periodo"
        inputClass="h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-xs font-semibold text-slate-700 shadow-sm outline-none transition hover:bg-slate-50 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
      />
    </label>
  </header>

  @defer (on idle) {
    <app-dashboard-summary-row [summary]="summary" [attendance]="attendance" />
    <app-dashboard-ranking-row [rankings]="rankings" [totalAbsences]="summary?.asistencia?.faltas ?? 0" />
    <app-dashboard-analytics-row [attendance]="attendance" [summary]="summary" />
    <app-dashboard-costs-row [costs]="costs" [summary]="summary" />
  } @placeholder {
    <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4" aria-label="Cargando indicadores del dashboard">
      @for (item of [1, 2, 3, 4]; track item) {
        <div class="h-32 animate-pulse rounded-lg border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
          <div class="m-4 h-3 w-24 rounded bg-slate-200 dark:bg-slate-700"></div>
          <div class="mx-4 mt-8 h-7 w-16 rounded bg-slate-200 dark:bg-slate-700"></div>
        </div>
      }
    </div>
  }
</section>
