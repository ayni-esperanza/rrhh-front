<section class="grid gap-3 xl:grid-cols-[1.4fr_.7fr_1.2fr]">
  <article class="min-w-0 rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h2 class="text-xs font-bold text-slate-950 dark:text-white">Porcentaje de ausentismo por area</h2>
    <div class="mt-3 h-44 min-w-0">
      <ngx-charts-bar-vertical
        [results]="areaAbsenteeism"
        [scheme]="areaScheme"
        [legend]="false"
        [xAxis]="true"
        [yAxis]="true"
        [showGridLines]="true"
        [roundEdges]="true"
        [showDataLabel]="true"
        [dataLabelFormatting]="percentFormat"
        [yAxisTickFormatting]="percentFormat"
        [barPadding]="20"
        [animations]="false">
      </ngx-charts-bar-vertical>
    </div>
    <a routerLink="/dashboard/reportes/ausentismo-por-area" queryParamsHandling="preserve" class="mt-1 block text-center text-[11px] font-bold text-blue-600 hover:text-blue-700">Ver reporte completo →</a>
  </article>
  <article class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900"><h2 class="text-xs font-bold text-slate-950 dark:text-white">Horas trabajadas por empleado</h2><p class="mt-4 text-[11px] font-semibold text-slate-500">(promedio)</p><strong class="block text-2xl text-slate-950 dark:text-white">{{ averageHours.toFixed(1) }} h</strong><p class="mt-3 text-xs font-bold text-slate-700 dark:text-slate-300">Horas extras (promedio)</p><strong class="mt-1 block text-2xl text-slate-950 dark:text-white">{{ averageExtraHours.toFixed(1) }} h</strong><a routerLink="/dashboard/reportes/horas-trabajadas" queryParamsHandling="preserve" class="mt-5 block text-center text-[11px] font-bold text-blue-600 hover:text-blue-700">Ver reporte completo →</a></article>
  <article class="min-w-0 rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h2 class="text-xs font-bold text-slate-950 dark:text-white">Asistencia mensual (%)</h2>
    <div class="mt-3 h-44 min-w-0">
      <ngx-charts-line-chart
        [results]="monthlyAttendance"
        [scheme]="attendanceScheme"
        [legend]="false"
        [xAxis]="true"
        [yAxis]="true"
        [showGridLines]="true"
        [autoScale]="true"
        [yScaleMin]="87"
        [yScaleMax]="93"
        [timeline]="false"
        [yAxisTickFormatting]="percentFormat"
        [animations]="false">
      </ngx-charts-line-chart>
    </div>
    <a routerLink="/dashboard/reportes/asistencia-mensual" queryParamsHandling="preserve" class="block text-center text-[11px] font-bold text-blue-600 hover:text-blue-700">Ver reporte completo →</a>
  </article>
</section>
