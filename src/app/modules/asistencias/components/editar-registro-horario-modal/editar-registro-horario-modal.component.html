@if (isOpen && draft) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-2 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="editar-registro-title" (click)="closeModal.emit()">
    <section class="max-h-[calc(100vh-1rem)] w-full max-w-lg overflow-visible rounded-xl bg-white p-4 shadow-2xl dark:bg-slate-900" (click)="$event.stopPropagation()">
      <header class="flex items-start justify-between gap-3">
        <h2 id="editar-registro-title" class="text-base font-bold text-slate-950 dark:text-white">Editar registro de horario</h2>
        <button class="inline-flex h-7 w-7 items-center justify-center rounded-md text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white" type="button" aria-label="Cerrar modal" (click)="closeModal.emit()">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>

      <div class="mt-3 grid gap-2 md:grid-cols-[1fr_1.15fr] md:items-center">
        <div class="flex items-center gap-2.5">
          <img class="h-10 w-10 rounded-full object-cover ring-2 ring-slate-100 dark:ring-slate-800" [src]="draft.avatar" [alt]="draft.colaborador" />
          <div>
            <p class="text-[11px] font-bold text-slate-950 dark:text-white">{{ draft.colaborador }}</p>
            <p class="mt-0.5 text-[11px] font-semibold text-slate-600 dark:text-slate-300">{{ draft.cargo }}</p>
          </div>
        </div>

        <label class="rounded-lg border border-slate-200 bg-white px-3 py-2 dark:border-slate-800 dark:bg-slate-950">
          <span class="flex items-center gap-2 text-[11px] font-bold text-slate-950 dark:text-white"><svg class="h-4 w-4 text-slate-700 dark:text-slate-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>Fecha</span>
          <span class="mt-0.5 block pl-6 text-[11px] font-semibold text-slate-700 dark:text-slate-300">{{ draft.fecha }}</span>
        </label>
      </div>

      <form class="mt-3 grid gap-2.5 md:grid-cols-2">
        <label class="space-y-1"><span class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Hora de entrada</span><app-date-picker [value]="timePickerValue(draft.entrada)" [timeOnly]="true" placeholder="hh:mm" inputClass="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 text-[11px] font-bold text-slate-700 outline-none dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 cursor-pointer" (valueChange)="setDraftTime('entrada', $event)" /></label>
        <label class="space-y-1"><span class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Hora de salida</span><app-date-picker [value]="timePickerValue(draft.salida)" [timeOnly]="true" placeholder="hh:mm" inputClass="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 text-[11px] font-bold text-slate-700 outline-none dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 cursor-pointer" (valueChange)="setDraftTime('salida', $event)" /></label>
        <label class="space-y-1"><span class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Entrada de almuerzo</span><app-date-picker [value]="timePickerValue(draft.entradaAlmuerzo)" [timeOnly]="true" placeholder="hh:mm" inputClass="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 text-[11px] font-bold text-slate-700 outline-none dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 cursor-pointer" (valueChange)="setDraftTime('entradaAlmuerzo', $event)" /></label>
        <label class="space-y-1"><span class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Salida de almuerzo</span><app-date-picker [value]="timePickerValue(draft.salidaAlmuerzo)" [timeOnly]="true" placeholder="hh:mm" inputClass="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 text-[11px] font-bold text-slate-700 outline-none dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200 cursor-pointer" (valueChange)="setDraftTime('salidaAlmuerzo', $event)" /></label>
        <label class="space-y-1"><span class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Horas trabajadas (normal)</span><span class="flex h-9 items-center rounded-lg bg-blue-50 px-3 text-[11px] font-bold text-blue-700 dark:bg-blue-500/10 dark:text-blue-300">{{ draft.horasNormales }}</span></label>
        <label class="space-y-1"><span class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Horas extras</span>@if (draft.tipoRegistro === 'Horas extras') { <app-select-searchable [(ngModel)]="draft.horasExtras" name="horasExtras" [options]="horasExtrasOptions" placeholder="Seleccionar cantidad" [allowEmpty]="false" buttonClass="h-9 w-full rounded-lg border border-emerald-200 bg-emerald-50 px-3 text-[11px] font-bold text-emerald-700 outline-none dark:border-emerald-500/30 dark:bg-emerald-500/10 dark:text-emerald-300" /> } @else { <span class="flex h-9 items-center rounded-lg bg-emerald-50 px-3 text-[11px] font-bold text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-300">{{ draft.horasExtras }}</span> }</label>
        <label class="space-y-1"><span class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Tipo de registro</span><app-select-searchable [(ngModel)]="draft.tipoRegistro" name="tipoRegistro" [options]="tipoRegistroOptions" [allowEmpty]="false" searchPlaceholder="Buscar tipo de registro..." buttonClass="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 text-[11px] font-bold text-slate-700 outline-none dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" /></label>
        <label class="space-y-1"><span class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Estado</span><app-select-searchable [(ngModel)]="draft.estado" name="estado" [options]="estados" [allowEmpty]="false" buttonClass="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 text-[11px] font-bold text-slate-700 outline-none dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" /></label>
        <label class="space-y-1 md:col-span-2"><span class="text-[11px] font-bold text-slate-800 dark:text-slate-200">Lugar donde esta trabajando</span><app-select-searchable [(ngModel)]="draft.lugar" name="lugar" [options]="lugares" [allowEmpty]="false" searchPlaceholder="Buscar lugar..." buttonClass="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 text-[11px] font-bold text-slate-700 outline-none dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200" /></label>
      </form>

      <footer class="mt-4 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
        <button class="h-9 rounded-lg border border-slate-200 px-5 text-[11px] font-bold text-slate-700 transition hover:bg-slate-50 dark:border-slate-800 dark:text-slate-200 dark:hover:bg-slate-800" type="button" (click)="closeModal.emit()">Cancelar</button>
        <button class="h-9 rounded-lg bg-[#22C55E] px-5 text-[11px] font-bold text-white shadow-sm transition hover:bg-[#22C55E] disabled:cursor-not-allowed disabled:opacity-50" type="button" [disabled]="draft.tipoRegistro === 'Horas extras' && !isExtraDuration(draft.horasExtras)" (click)="save()">Guardar cambios</button>
      </footer>
    </section>
  </div>
}
