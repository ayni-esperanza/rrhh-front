<div animate.enter="ayni-modal-enter" animate.leave="ayni-modal-leave" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/60 p-3 backdrop-blur-[2px] sm:p-5" role="dialog" aria-modal="true" aria-labelledby="pdf-viewer-title" (click)="closeModal.emit()">
  <section class="flex h-full max-h-[calc(100dvh-1.5rem)] w-full max-w-6xl flex-col overflow-hidden rounded-xl border border-white/10 bg-white shadow-2xl dark:border-slate-700 dark:bg-slate-900 sm:max-h-[calc(100dvh-2.5rem)]" (click)="$event.stopPropagation()">
    <header class="flex shrink-0 items-center justify-between gap-3 border-b border-slate-200 px-4 py-3 dark:border-slate-800">
      <div class="min-w-0"><h2 id="pdf-viewer-title" class="truncate text-sm font-bold text-slate-950 dark:text-white">{{ fileName }}</h2><p class="text-[11px] text-slate-500 dark:text-slate-400">Vista previa del documento</p></div>
      <button type="button" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white" aria-label="Cerrar visor PDF" title="Cerrar" (click)="closeModal.emit()"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg></button>
    </header>

    <div class="flex shrink-0 flex-wrap items-center gap-2 border-b border-slate-200 bg-slate-50 px-3 py-2 dark:border-slate-800 dark:bg-slate-950">
      <button type="button" class="pdf-toolbar-button" aria-label="Página anterior" title="Página anterior" [disabled]="currentPage <= 1" (click)="previousPage()"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6" /></svg></button>
      <label class="flex items-center gap-1 text-[11px] font-semibold text-slate-600 dark:text-slate-300"><span>Página</span><input class="h-8 w-14 rounded-md border border-slate-200 bg-white px-2 text-center text-xs outline-none focus:border-green-500 dark:border-slate-700 dark:bg-slate-900" type="number" min="1" [max]="totalPages" [value]="currentPage" (change)="setPage($any($event.target).value)" /><span>de {{ totalPages || '—' }}</span></label>
      <button type="button" class="pdf-toolbar-button" aria-label="Página siguiente" title="Página siguiente" [disabled]="currentPage >= totalPages" (click)="nextPage()"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6" /></svg></button>
      <span class="mx-1 hidden h-6 w-px bg-slate-200 dark:bg-slate-700 sm:block"></span>
      <button type="button" class="pdf-toolbar-button" aria-label="Alejar" title="Alejar" [disabled]="zoom <= 0.4" (click)="zoomOut()">−</button>
      <span class="min-w-12 text-center text-[11px] font-bold text-slate-600 dark:text-slate-300">{{ zoomPercent }}%</span>
      <button type="button" class="pdf-toolbar-button" aria-label="Acercar" title="Acercar" [disabled]="zoom >= 3" (click)="zoomIn()">+</button>
      <button type="button" class="pdf-toolbar-button px-2" title="Ajustar al ancho" (click)="fitWidth()">Ajustar</button>
      <div class="order-last flex w-full min-w-0 items-center gap-1 sm:order-none sm:ml-auto sm:w-auto">
        <input class="h-8 min-w-0 flex-1 rounded-md border border-slate-200 bg-white px-2 text-xs outline-none focus:border-green-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 sm:w-44" placeholder="Buscar en el PDF" [value]="searchQuery" (input)="searchQuery = $any($event.target).value" (keydown.enter)="findNext()" />
        <button type="button" class="pdf-toolbar-button px-2" (click)="findNext()">Buscar</button>
      </div>
      <button type="button" class="pdf-toolbar-button sm:ml-1" aria-label="Imprimir PDF" title="Imprimir" (click)="print()"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg></button>
      <button type="button" class="pdf-toolbar-button" aria-label="Descargar PDF" title="Descargar" (click)="download()"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg></button>
    </div>

    @if (searchMessage) { <p class="shrink-0 border-b border-slate-200 bg-white px-4 py-1.5 text-[11px] font-semibold text-slate-600 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300" aria-live="polite">{{ searchMessage }}</p> }

    <div #viewerContainer class="relative min-h-0 flex-1 overflow-auto bg-slate-200 p-4 dark:bg-slate-950">
      @if (isLoading) { <div class="absolute inset-0 z-10 flex items-center justify-center bg-slate-100/90 text-xs font-semibold text-slate-600 dark:bg-slate-950/90 dark:text-slate-300">Cargando PDF…</div> }
      @if (errorMessage) { <div class="absolute inset-0 z-10 flex items-center justify-center bg-slate-100 p-6 text-center text-sm font-semibold text-rose-600 dark:bg-slate-950 dark:text-rose-300">{{ errorMessage }}</div> }
      <canvas #pdfCanvas class="pdf-canvas mx-auto bg-white"></canvas>
    </div>
  </section>
</div>
